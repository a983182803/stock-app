<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>選股平台</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1f2a30; --mute:#6b7478; --line:#e4e4e0; --up:#d6453d; --down:#1f9d55; --dark:#26343b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:calc(14px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left)); }
  header { display:flex; align-items:center; gap:10px; }
  h1 { font-size:24px; margin:0; flex:1; }
  button { font:inherit; border:0; border-radius:10px; padding:9px 14px; background:var(--dark); color:#fff; font-weight:600; }
  button.ghost { background:#e9ebe8; color:var(--ink); }
  button:disabled { opacity:.5; }
  .sub { color:var(--mute); font-size:13px; margin:6px 0 10px; line-height:1.5; }
  h3 { font-size:18px; margin:22px 0 6px; }
  .conds { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-size:13px; }
  .chip.need { background:var(--dark); color:#fff; border-color:var(--dark); }
  .tw { overflow-x:auto; -webkit-overflow-scrolling:touch; background:var(--card); border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); margin-top:10px; }
  table { width:100%; border-collapse:collapse; white-space:nowrap; }
  th, td { padding:10px 11px; text-align:left; font-size:14px; border-bottom:1px solid var(--line); }
  th { background:var(--dark); color:#fff; font-weight:600; font-size:13px; }
  th.ref { background:#4a5a60; }
  tr.row { cursor:pointer; } tr.sel { background:#eaf1f8; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .up { color:var(--up); } .down { color:var(--down); }
  .ok { color:var(--down); font-weight:700; } .no { color:#b9bdbf; }
  .pass { background:var(--up); color:#fff; border-radius:6px; padding:2px 8px; font-size:12px; font-weight:700; }
  .small { color:var(--mute); font-size:12px; }
  .sig { display:inline-block; border-radius:6px; padding:2px 7px; margin:1px 3px 1px 0; font-size:12px; font-weight:600; }
  .sig.weak { background:#e6f4ec; color:#16794a; } .sig.strong { background:#fbe9e7; color:#b3362f; }
  .mk { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:12px; }
  .card { background:var(--card); border-radius:12px; padding:14px 16px; box-shadow:0 1px 3px rgba(0,0,0,.06); cursor:pointer; }
  .card.sel { outline:2px solid #2f5d8a; }
  .card .big { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; }
  .card .row2 { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:14px; margin-top:8px; }
  .card .k { color:var(--mute); }
  .panel { background:var(--card); border-radius:12px; margin-top:18px; padding:14px 12px 6px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .panel h2 { font-size:17px; margin:0 0 6px; }
  .legend { font-size:12px; color:var(--mute); margin:2px 0 8px; display:flex; flex-wrap:wrap; gap:10px; }
  .legend i { display:inline-block; width:14px; height:3px; vertical-align:middle; margin-right:4px; }
  canvas { width:100%; display:block; }
  .note { color:var(--mute); font-size:12px; margin-top:16px; line-height:1.6; }
  .addbar { display:flex; gap:6px; margin:4px 0 6px; flex-wrap:wrap; }
  .addbar input { width:auto; flex:1 1 88px; min-width:0; padding:9px 10px; font-size:16px; }
  .addbar input#aId { flex:2 1 120px; }
  .addbar button { flex:0 0 auto; }
  .panel .pbar { display:flex; align-items:center; gap:8px; }
  .panel .pbar h2 { flex:1; }
  .panel .pbar button { padding:6px 10px; font-size:13px; }
  .tabs { display:flex; gap:6px; margin:8px 0 2px; position:sticky; top:0; z-index:5; background:var(--bg); padding:6px 0; }
  .tabs button { flex:1; background:#e9ebe8; color:var(--ink); padding:9px 6px; font-size:15px; }
  .tabs button.on { background:var(--dark); color:#fff; }
  .plan { margin:6px 0 2px; padding:0; list-style:none; }
  .plan li { padding:7px 0; border-top:1px solid var(--line); font-size:14px; line-height:1.5; }
  .plan li:first-child { border-top:0; }

  .plan .px { font-weight:700; font-variant-numeric:tabular-nums; margin-right:6px; }
  details.hc { background:var(--card); border-radius:12px; padding:10px 14px; margin-top:8px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  details.hc summary { cursor:pointer; font-size:15px; list-style:none; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  details.hc summary::-webkit-details-marker { display:none; }
  details.hc summary::after { content:"▾"; margin-left:auto; color:var(--mute); }
  details.hc[open] summary::after { content:"▴"; }
  .pick { background:var(--card); border-radius:12px; padding:14px 16px; margin-top:10px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .pick .hd { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .pick .hd .nm { font-size:18px; font-weight:700; }
  .tag { display:inline-block; background:#eef2f5; border-radius:6px; padding:2px 7px; margin:2px 3px 2px 0; font-size:12px; }
  .tag.no { background:#f3f3f1; color:#a3a8aa; text-decoration:line-through; }
  .pick .act { display:flex; gap:8px; margin-top:10px; } .pick .act button { flex:1; padding:9px; }
  .news { background:var(--card); border-radius:12px; padding:14px 16px; margin-top:10px; box-shadow:0 1px 3px rgba(0,0,0,.06); font-size:15px; line-height:1.65; }
  .news h1, .news h2 { font-size:17px; margin:12px 0 6px; } .news h3 { font-size:15px; margin:10px 0 4px; }
  .news table { white-space:normal; font-size:13px; } .news th, .news td { padding:6px 8px; font-size:13px; }
  .news .tw { box-shadow:none; border:1px solid var(--line); }
  .news ul, .news ol { padding-left:20px; margin:6px 0; } .news a { color:#2f5d8a; }
  .newslist button { margin:4px 4px 0 0; padding:6px 10px; font-size:13px; }
  .status { background:#fff7e0; border-radius:10px; padding:10px 12px; font-size:14px; margin:10px 0; display:none; }
  .status.err { background:#fde8e6; color:#9b2c24; }
  .empty { background:var(--card); border-radius:12px; padding:22px 18px; margin-top:14px; line-height:1.7; }
  /* 設定 */
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; z-index:10; }
  .sheet.open { display:block; }
  .sheet .box { position:absolute; left:0; right:0; bottom:0; max-height:92vh; overflow:auto; background:var(--bg); border-radius:16px 16px 0 0; padding:16px 16px calc(24px + env(safe-area-inset-bottom)); }
  .sheet h2 { margin:0 0 10px; font-size:20px; }
  label { display:block; font-size:14px; font-weight:600; margin:14px 0 6px; }
  input, textarea { width:100%; font:inherit; font-size:16px; border:1px solid var(--line); border-radius:10px; padding:10px; background:#fff; }
  textarea { min-height:160px; font-family:ui-monospace,Menlo,monospace; font-size:15px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid label { margin-top:4px; font-weight:500; }
  .checks label { display:inline-flex; align-items:center; gap:6px; margin-right:14px; font-weight:500; }
  .checks input { width:auto; }
  .btns { display:flex; gap:10px; margin-top:18px; }
  .btns button { flex:1; padding:12px; }
</style>

<body>
<div class="wrap">
  <header>
    <h1>選股平台</h1>
    <button class="ghost" id="bSet">設定</button>
    <button id="bRun">更新</button>
  </header>
  <div class="addbar">
    <input id="aId" placeholder="輸入股號，如 2454" inputmode="text" autocomplete="off" autocapitalize="characters">
    <input id="aSh" placeholder="股數（選填）" inputmode="numeric">
    <input id="aCo" placeholder="成本（選填）" inputmode="decimal">
    <button id="bAdd">加入</button>
    <button class="ghost" id="bLook">查詢</button>
  </div>
  <div class="sub" id="sub"></div>
  <div class="small" id="ver" style="text-align:right;margin-top:-6px"></div>
  <div class="status" id="status"></div>
  <nav class="tabs"><button class="on" data-t="1">持股與大盤</button><button data-t="2">智選股</button><button data-t="3">每日新聞</button></nav>
  <div id="main"></div>
  <div id="tab2" style="display:none"></div>
  <div id="tab3" style="display:none"></div>
</div>

<div class="sheet" id="sheet"><div class="box">
  <h2>設定</h2>
  <label>FinMind token</label>
  <input id="fTok" type="password" autocomplete="off" placeholder="貼上你的 FinMind token">
  <div class="small">只存在這支手機上，不會上傳到其他地方。</div>
  <label>觀察股與持股（一行一檔）</label>
  <textarea id="fList" placeholder="代號 股數 成本&#10;2330 400 1997.24&#10;2317 2000 259.22&#10;2454（只寫代號＝只觀察、不算持股）"></textarea>
  <div class="small">格式：代號 股數 成本。只寫代號代表只觀察。股票數量越多，更新越久，也越耗 FinMind 查詢額度。</div>
  <label>選股條件</label>
  <div class="grid">
    <div><label>均線天數</label><input id="cMA" type="number" inputmode="numeric"></div>
    <div><label>外資連買天數</label><input id="cFB" type="number" inputmode="numeric"></div>
    <div><label>RSI 短</label><input id="cRS" type="number" inputmode="numeric"></div>
    <div><label>RSI 長</label><input id="cRL" type="number" inputmode="numeric"></div>
    <div><label>K 天數</label><input id="cK" type="number" inputmode="numeric"></div>
    <div><label>D 天數</label><input id="cD" type="number" inputmode="numeric"></div>
    <div><label>融資比較天數</label><input id="cMG" type="number" inputmode="numeric"></div>
  </div>
  <label>「符合」需要的條件</label>
  <div class="checks" id="cNeed"></div>
  <label>智選股候選池（股號用空白隔開）</label>
  <textarea id="fPool" style="min-height:90px"></textarea>
  <div class="checks"><label><input type="checkbox" id="fNoFin">排除金融股</label></div>
  <div class="small">候選池越大，掃描越久、越耗 FinMind 額度（每檔約 1 次查詢）。留空會使用預設的 55 檔大型股。</div>
  <label>匯入／匯出設定碼</label>
  <textarea id="fCode" style="min-height:80px" placeholder="把設定碼貼在這裡後按「匯入」"></textarea>
  <div class="btns"><button class="ghost" id="bExp">匯出</button><button class="ghost" id="bImp">匯入</button></div>
  <div class="btns"><button class="ghost" id="bCancel">取消</button><button id="bSave">儲存</button></div>
</div></div>

<script>
"use strict";
const APP_VER = "2026.11.13-1";
const API = "https://api.finmindtrade.com/api/v4/data";
const DEF_COND = { "均線天數": 20, "顯示均線": [5, 10, 20, 60], "RSI短": 5, "RSI長": 10, "K天數": 5, "D天數": 5, "外資連買天數": 3, "融資比較天數": 5, "必要條件": ["RSI", "KD", "均線"] };
const NEED_KEYS = [["均線", "站上均線"], ["RSI", "RSI 短>長"], ["KD", "K>D"], ["外資", "外資連買"], ["融資", "融資減少"]];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let S = store.get("settings", { token: "", list: [], cond: DEF_COND, names: {} });
S.cond = Object.assign({}, DEF_COND, S.cond || {});
S.names = S.names || {};

/* ---------- 抓資料 ---------- */
const iso = d => d.toISOString().slice(0, 10);
const ago = n => iso(new Date(Date.now() - n * 864e5));
async function fetchDS(dataset, id, start) {
  const q = new URLSearchParams({ dataset, data_id: id || "", start_date: start, token: S.token });
  for (let a = 0; a < 3; a++) {
    try {
      const r = await fetch(`${API}?${q}`);
      const js = await r.json();
      if (js.status !== 200) throw new Error(js.msg || ("HTTP " + r.status));
      return js.data || [];
    } catch (e) {
      if (a === 2) throw new Error(`${dataset} ${id}：${e.message}`);
      await new Promise(res => setTimeout(res, 1500));
    }
  }
}
async function pool(tasks, n, onDone) {
  const out = new Array(tasks.length); let i = 0, done = 0;
  async function worker() { while (i < tasks.length) { const k = i++; out[k] = await tasks[k](); onDone && onDone(++done, tasks.length); } }
  await Promise.all(Array.from({ length: Math.min(n, tasks.length) }, worker));
  return out;
}

/* ---------- 指標 ---------- */
const r2 = v => Math.round(v * 100) / 100;
const sma = (v, n) => v.map((_, i) => i + 1 < n ? null : r2(v.slice(i + 1 - n, i + 1).reduce((a, b) => a + b, 0) / n));
function rsi(c, n) {
  const out = c.map(() => null); if (c.length <= n) return out;
  const g = [], l = [];
  for (let i = 1; i < c.length; i++) { g.push(Math.max(c[i] - c[i - 1], 0)); l.push(Math.max(c[i - 1] - c[i], 0)); }
  let ag = g.slice(0, n).reduce((a, b) => a + b, 0) / n, al = l.slice(0, n).reduce((a, b) => a + b, 0) / n;
  for (let i = n; i < c.length; i++) {
    if (i > n) { ag = (ag * (n - 1) + g[i - 1]) / n; al = (al * (n - 1) + l[i - 1]) / n; }
    out[i] = r2(al === 0 ? 100 : 100 - 100 / (1 + ag / al));
  }
  return out;
}
function kd(h, l, c, n) {
  let k = 50, d = 50; const ks = [], ds = [];
  for (let i = 0; i < c.length; i++) {
    if (i + 1 < n) { ks.push(null); ds.push(null); continue; }
    const hh = Math.max(...h.slice(i + 1 - n, i + 1)), ll = Math.min(...l.slice(i + 1 - n, i + 1));
    const rsv = hh === ll ? 50 : (c[i] - ll) / (hh - ll) * 100;
    k = k * 2 / 3 + rsv / 3; d = d * 2 / 3 + k / 3; ks.push(r2(k)); ds.push(r2(d));
  }
  return [ks, ds];
}
const MANAME = { 5: "5日線", 10: "10日線", 20: "月線", 60: "季線", 120: "半年線", 240: "年線" };
function levels(prices, c, mas, nWin = 120, sw = 3) {
  /* 關鍵壓力／支撐：候選價位 → 依 ATR 合併成價格帶 → 依強度（觸及次數、成交量、均線重疊、距離）各挑一條 */
  const P = prices.slice(-nWin), n = P.length, cl = c[c.length - 1];
  if (n < 10) return [[], []];
  let atr = 0, k = 0;
  for (let i = Math.max(1, n - 14); i < n; i++) { atr += Math.max(P[i].max - P[i].min, Math.abs(P[i].max - P[i - 1].close), Math.abs(P[i].min - P[i - 1].close)); k++; }
  atr = k ? atr / k : cl * 0.02;
  const band = Math.max(cl * 0.012, atr * 0.5);
  const cand = []; // {p, lab, w, ma, down}
  const hs = P.map(r => r.max), ls = P.map(r => r.min);
  for (let i = sw; i < n - sw; i++) {
    const md = P[i].date.slice(5).replace("-", "/"), recent = i >= n - 20 ? 1 : 0;
    if (hs[i] === Math.max(...hs.slice(i - sw, i + sw + 1))) cand.push({ p: hs[i], lab: "前高 " + md, w: 2 + recent });
    if (ls[i] === Math.min(...ls.slice(i - sw, i + sw + 1))) cand.push({ p: ls[i], lab: "前低 " + md, w: 2 + recent });
  }
  const MW = { 5: 0.5, 10: 0.7, 20: 1.2, 60: 1.5, 120: 1.5, 240: 1.5 };
  for (const [m, v] of Object.entries(mas)) if (v.length && v[v.length - 1] != null) {
    const L = v.length - 1; cand.push({ p: v[L], lab: MANAME[m] || "MA" + m, w: MW[m] || 1, ma: +m, down: L >= 5 && v[L - 5] != null && v[L] < v[L - 5] });
  }
  // 量價分布：成交量特別集中的價格帶
  const lo = Math.min(...ls), hi = Math.max(...hs), NB = 40, bw = (hi - lo) / NB || 1, vb = new Array(NB).fill(0);
  P.forEach(r => { const tp = (r.max + r.min + r.close) / 3; vb[Math.min(NB - 1, Math.floor((tp - lo) / bw))] += r.Trading_Volume || 0; });
  const vmax = Math.max(...vb), vavg = vb.reduce((a, b) => a + b, 0) / NB;
  vb.forEach((v, i) => { if (v >= vavg * 1.5 && v >= (vb[i - 1] || 0) && v >= (vb[i + 1] || 0)) cand.push({ p: lo + bw * (i + 0.5), lab: "大量成交區", w: 3 * v / (vmax || 1) }); });
  // 整數關卡
  let st = 0.1; for (const e of [0.1, 1, 10, 100, 1000, 10000]) for (const m of [1, 2, 5]) if (st === 0.1 && m * e >= cl * 0.04) st = m * e;
  if (st < cl * 0.04) st = cl * 0.04;
  for (let q = Math.ceil(cl * 0.85 / st) * st; q <= cl * 1.15; q += st) if (q > 0) cand.push({ p: q, lab: "整數關卡 " + fmt(+q.toFixed(2)), w: 0.5 });
  // 合併成價格帶
  cand.sort((a, b) => a.p - b.p);
  const groups = [];
  cand.forEach(x => { const g = groups[groups.length - 1]; if (g && x.p - g.start <= band) g.items.push(x); else groups.push({ start: x.p, items: [x] }); });
  const Z = groups.map(g => {
    const W = g.items.reduce((a, x) => a + x.w, 0), ctr = g.items.reduce((a, x) => a + x.p * x.w, 0) / W;
    let zlo = Math.min(...g.items.map(x => x.p)), zhi = Math.max(...g.items.map(x => x.p));
    if (zhi - zlo < band * 0.5) { zlo = ctr - band * 0.25; zhi = ctr + band * 0.25; }
    const touch = P.filter(r => r.max >= zlo && r.min <= zhi).length;        // 價格進入這個帶的天數
    const score = W + Math.min(touch, 30) / 10;
    const items = g.items.slice().sort((a, b) => b.w - a.w), kinds = {};
    items.forEach(x => { const kd_ = /^(前高|前低)/.test(x.lab) ? x.lab.slice(0, 2) : x.lab; (kinds[kd_] = kinds[kd_] || []).push(x); });
    const labs = Object.entries(kinds).map(([kd_, xs]) => xs.length > 1 && /^(前高|前低)$/.test(kd_) ? `${kd_}（${xs.length} 次，最近 ${xs.map(x => x.lab.slice(3)).sort().pop()}）` : xs[0].lab);
    const mi = items.filter(x => x.ma);
    return { ctr, zlo, zhi, score, labs, ma: mi.length ? mi[0].ma : null, maDown: mi.length > 0 && mi.every(x => x.down) };
  });
  // 星等依這檔股票自己所有價格帶的強度排名：前 15% ★★★、前 40% ★★、其餘 ★
  const sc = Z.map(z => z.score).sort((a, b) => b - a), rank = v => sc.findIndex(x => x <= v) / Math.max(1, sc.length - 1);
  const dp = cl >= 1000 ? 0 : cl >= 100 ? 1 : 2, rd = v => +v.toFixed(dp);
  const out = z => ({ price: rd(z.ctr), lo: rd(z.zlo), hi: rd(z.zhi), label: z.labs[0], with: z.labs.slice(1, 4), dist: Math.round((z.ctr - cl) / cl * 1000) / 10,
    ma: z.ma, maDown: z.maDown, score: Math.round(z.score * 10) / 10, stars: rank(z.score) <= 0.15 ? 3 : rank(z.score) <= 0.4 ? 2 : 1 });
  const adj = z => z.score * Math.exp(-Math.abs(z.ctr - cl) / cl / 0.08);
  const best = arr => arr.length ? arr.reduce((a, b) => adj(b) > adj(a) ? b : a) : null;
  const up = Z.filter(z => z.zlo > cl * 1.002), dn = Z.filter(z => z.zhi < cl * 0.998);

  for (const c of mp.cands) { if (S.noFin && isFin(c)) continue; if (seen[c.ind]) continue; seen[c.ind] = 1; chosen.push(c); if (chosen.length >= 5) break; }
  setStatus("抓取入選股票的完整資料…");
  chosen.forEach(c => { S.names[c.id] = S.names[c.id] || c.name; (S.ind = S.ind || {})[c.id] = c.ind; });
  const picks = (await pool(chosen.map(c => async () => { try { const r = await fetchStock({ id: c.id }, S.cond); if (r) r.preview = true; return r; } catch (e) { return null; } }), 3)).filter(Boolean);
  setStatus("");
  const out = { key, full: true, day: mp.day, at: mp.at, scanned: mp.scanned, universe: mp.universe, passed: mp.passed, picks };
  store.set("picksFull", out); return out;
}
async function renderPicks(force) {
  const el = $("tab2");
  const cache = store.get("picks", null);
  const head = (c) => c && c.full ? `<h3>智選股・全市場</h3><div class="sub">Mac mini 每晚掃描全部上市櫃 ${c.universe} 檔（本次掃描 ${c.scanned} 檔），先要求站上月線、月線在季線之上、月線上揚，趨勢分數至少 7 分，20 日平均成交金額 3 億以上；再依 20 日漲幅由強到弱排序，每個產業最多 1 檔，取前 5 檔${S.noFin ? "（已排除金融股）" : ""}。這是依固定規則篩出的技術面結果，不是推薦買進。</div>
    <div class="btns" style="margin-top:6px"><button class="ghost" id="bScan">改用候選池掃描（約 80 次查詢）</button></div>` : `<h3>智選股</h3><div class="sub">從 ${c ? c.scanned : poolIds().length} 檔候選池中，每天篩一次。先要求站上月線、月線在季線之上、月線上揚，趨勢分數至少 7 分，20 日平均成交金額 3 億以上；再依 20 日漲幅由強到弱排序，每個產業最多 1 檔，取前 5 檔${S.noFin ? "（已排除金融股）" : ""}。這是依固定規則篩出的技術面結果，不是推薦買進。候選池可在「設定」修改。</div>
    <div class="btns" style="margin-top:6px"><button class="ghost" id="bScan">${c ? "重新掃描（約 80 次查詢）" : "開始掃描"}</button></div>`;
  const draw = c => {
    if (!c) { el.innerHTML = head(null); $("bScan").onclick = () => renderPicks(true); return; }
    el.innerHTML = head(c) + `<div class="sub">${c.full ? "全市場" : ""}${c.day === iso(new Date()) ? "今天" : "上次"} ${c.at} 掃描・${c.passed} 檔通過核心條件${c.picks.length ? "" : "，今天沒有符合的股票"}</div>` +
      c.picks.map((r, i) => `<div class="pick"><div class="hd"><span class="nm">${r.id} ${r.name}</span><span>${fmt(r.close)}</span><span class="${cls(r.chg)}">${sign(r.chg)}</span><span class="small">${(S.ind || {})[r.id] || ""}・趨勢分數 ${r.trend.score}/9・20 日 ${r.trend.ret20 > 0 ? "+" : ""}${r.trend.ret20}%</span></div>
        <div style="margin-top:6px">${r.trend.checks.map(([t, ok]) => `<span class="tag ${ok ? "" : "no"}">${t}</span>`).join("")}</div>
        <div class="row2" style="display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin-top:8px"><span class="small">關鍵壓力</span><span>${lvTxt(r.res[0])}</span><span class="small">關鍵支撐</span><span>${lvTxt(r.sup[0])}</span>
        <span class="small">籌碼</span><span>外資 ${r.foreign.map(sign).join("、") || "—"}・融資 ${sign(r.margin_chg)}</span><span class="small">基本面</span><span>月營收年增 ${r.rev && r.rev.yoy != null ? sign(r.rev.yoy) + "%" : "—"}・EPS ${r.eps ? r.eps.eps + "（" + r.eps.label + "）" : "—"}</span></div>
        ${planHtml(r)}
        <div class="act"><button class="ghost" data-chart="${i}">看圖表</button><button data-add="${r.id}">${S.list.some(x => x.id === r.id) ? "已在觀察名單" : "加入觀察"}</button></div></div>`).join("");
    $("bScan").onclick = () => renderPicks(true);
    el.querySelectorAll("[data-chart]").forEach(b => b.onclick = () => { showTab("1"); if (!$("cv")) render(currentData()); const r = c.picks[+b.dataset.chart]; r.preview = !S.list.some(x => x.id === r.id); select(null); drawItem(r); $("cv").scrollIntoView({ behavior: "smooth", block: "start" }); });
    el.querySelectorAll("[data-add]").forEach(b => b.onclick = async () => { if (S.list.some(x => x.id === b.dataset.add)) return; await addStock(b.dataset.add); b.textContent = "已在觀察名單"; });
  };
  // 先用 Mac mini 每晚的全市場結果；沒有才用候選池掃描
  try {
    const full = await marketPicks(force === "full");
    if (full && force !== true) { draw(full); return; }
  } catch (e) {}
  draw(cache);
  if (force === true || !cache) { try { draw(await scanPicks()); } catch (e) { setStatus("掃描失敗：" + e.message, true); } }
}

/* ---------- 每日新聞 ---------- */
function md(src) {
  const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = src.split(/\r?\n/); let h = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*\|/.test(l)) {
      const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(x => x.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      h += `<div class="tw"><table><thead><tr>${cells(body[0]).map(c => `<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${body.slice(1).map(r => `<tr>${cells(r).map(c => `<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      continue;
    }
    let m;
    if ((m = l.match(/^(#{1,3})\s+(.*)/))) { h += `<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`; i++; continue; }
    if (/^\s*([-*•]|\d+[.、])\s+/.test(l)) {
      const ord = /^\s*\d/.test(l); let items = "";
      while (i < lines.length && /^\s*([-*•]|\d+[.、])\s+/.test(lines[i])) items += `<li>${inl(lines[i++].replace(/^\s*([-*•]|\d+[.、])\s+/, ""))}</li>`;
      h += ord ? `<ol>${items}</ol>` : `<ul>${items}</ul>`; continue;
    }
    if (l.trim()) h += `<p>${inl(l)}</p>`;
    i++;
  }
  return h;
}
async function loadNews() {
  const el = $("tab3");
  el.innerHTML = `<h3>每日新聞</h3><div class="sub">讀取中…</div>`;
  try {
    const r = await fetch("news.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("none");
    const js = await r.json(), items = (js.items || []).slice().sort((a, b) => a.time < b.time ? 1 : -1);
    if (!items.length) throw new Error("none");
    const show = k => {
      const it = items[k];
      el.innerHTML = `<h3>每日新聞</h3><div class="newslist">${items.slice(0, 10).map((x, j) => `<button class="${j === k ? "" : "ghost"}" data-k="${j}">${x.time.slice(5, 10).replace("-", "/")} ${x.type}</button>`).join("")}</div>
        <div class="news"><div class="small">${it.time}・${it.type}</div>${md(it.markdown || "")}</div>`;
      el.querySelectorAll("[data-k]").forEach(b => b.onclick = () => show(+b.dataset.k));
    };
    show(0);
  } catch (e) {
    el.innerHTML = `<h3>每日新聞</h3><div class="empty">每日財經早報、晚報還沒有連到這個網站。<br>連好之後，每天 08:00 和 21:30 的簡報會自動出現在這裡。</div>`;
  }
}
